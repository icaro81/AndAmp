name: AndAmp Android CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR=$(command -v sdkmanager || ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Determine app version from tag if present
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "version_name=${TAG_VER}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=1.0.0" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Build Installable APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            -PandampVersionName="${{ steps.version.outputs.version_name }}" \
            -PandampVersionCode="${{ steps.version.outputs.version_code }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AndAmp-v${{ steps.version.outputs.version_name }}.apk"

      - name: Build Signed Release APK (optional when keystore secrets are configured)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${UPLOAD_KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "${UPLOAD_KEYSTORE_BASE64}" | base64 -d > my-upload-key.jks
            gradle :app:assembleRelease --no-daemon --stacktrace \
              -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
              -Dorg.gradle.workers.max=2 \
              -PandampVersionName="${{ steps.version.outputs.version_name }}" \
              -PandampVersionCode="${{ steps.version.outputs.version_code }}"
            cp app/build/outputs/apk/release/app-release.apk "dist/AndAmp-v${{ steps.version.outputs.version_name }}-release.apk"
          else
            echo "Release keystore secrets not configured; publishing consistent debug-signed APK."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AndAmp-v${{ steps.version.outputs.version_name }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.version.outputs.is_tag }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.apk --clobber
            else
              gh release create "$TAG" dist/*.apk \
                --title "AndAmp ${TAG}" \
                --generate-notes
            fi
          else
            CI_TAG="latest-ci"
            if gh release view "$CI_TAG" >/dev/null 2>&1; then
              gh release upload "$CI_TAG" dist/*.apk --clobber
              gh release edit "$CI_TAG" \
                --title "AndAmp CI Build #${{ github.run_number }}" \
                --notes "Compilación automática desde \`${{ github.ref_name }}\` (commit \`${{ github.sha }}\`). Descarga directa del archivo \`.apk\` abajo."
            else
              gh release create "$CI_TAG" dist/*.apk \
                --prerelease \
                --title "AndAmp CI Build #${{ github.run_number }}" \
                --notes "Compilación automática desde \`${{ github.ref_name }}\` (commit \`${{ github.sha }}\`). Descarga directa del archivo \`.apk\` abajo."
            fi
          fi

      - name: Write APK Download Summary
        run: |
          {
            echo "### AndAmp APK compilado"
            echo ""
            for f in dist/*.apk; do
              echo "- **Archivo:** \`$(basename "$f")\`"
            done
            if [ "${{ steps.version.outputs.is_tag }}" = "true" ]; then
              echo "- **Descarga directa (Release ${{ github.ref_name }}):** https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            elif [ "${{ github.event_name }}" = "push" ]; then
              echo "- **Descarga directa (Pre-release CI):** https://github.com/${{ github.repository }}/releases/tag/latest-ci"
            fi
            echo "- **Artefactos del workflow:** revisa la pestaña **Summary** de esta ejecución."
          } >> "$GITHUB_STEP_SUMMARY"
