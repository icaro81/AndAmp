name: AndAmp Android CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode and verify persistent keystore
        run: |
          EXPECTED_SHA256="7C:6F:C6:39:08:32:BB:58:76:67:E5:8B:3C:1D:B7:61:53:23:C5:54:9A:E0:6F:5B:79:BD:FC:FD:2D:61:1B:ED"
          if [ ! -s debug.keystore.base64 ]; then
            echo "::error::Falta debug.keystore.base64; abortando para evitar conflictos de firma al actualizar."
            exit 1
          fi
          base64 -d debug.keystore.base64 > debug.keystore
          ACTUAL_SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:" | head -n1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d '[:space:]')
          echo "Keystore SHA256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::La firma del keystore ($ACTUAL_SHA256) no coincide con la firma esperada ($EXPECTED_SHA256)."
            exit 1
          fi

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR=$(command -v sdkmanager || ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Determine app version and monotonic versionCode
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "version_name=${TAG_VER}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VER="1.1.${{ github.run_number }}"
            echo "version_name=${VER}" >> "$GITHUB_OUTPUT"
            echo "release_tag=v${VER}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          # Strictly monotonic epoch-based versionCode (10s buckets) prevents downgrade conflicts across forks/workflows
          CODE=$(( $(date -u +%s) / 10 ))
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Run Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Build and Verify Installable APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            -PandampVersionName="${{ steps.version.outputs.version_name }}" \
            -PandampVersionCode="${{ steps.version.outputs.version_code }}"
          mkdir -p dist
          OUT_APK="dist/AndAmp-v${{ steps.version.outputs.version_name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT_APK"
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT_APK"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: AndAmp-v${{ steps.version.outputs.version_name }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          VER="${{ steps.version.outputs.version_name }}"
          gh release delete latest-ci -y >/dev/null 2>&1 || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" \
              --latest \
              --title "AndAmp ${TAG}" \
              --notes "Compilación automática desde \`${{ github.ref_name }}\` (commit \`${{ github.sha }}\`). Descarga e instala \`AndAmp-v${VER}.apk\` directamente abajo o actualiza desde **MISC → ACTUALIZACIONES** dentro de AndAmp."
          else
            gh release create "$TAG" dist/*.apk \
              --target "${{ github.sha }}" \
              --latest \
              --title "AndAmp ${TAG}" \
              --notes "Compilación automática desde \`${{ github.ref_name }}\` (commit \`${{ github.sha }}\`). Descarga e instala \`AndAmp-v${VER}.apk\` directamente abajo o actualiza desde **MISC → ACTUALIZACIONES** dentro de AndAmp."
          fi

      - name: Write APK Download Summary
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          VER="${{ steps.version.outputs.version_name }}"
          {
            echo "### AndAmp APK compilado (v${VER})"
            echo ""
            for f in dist/*.apk; do
              BASE="$(basename "$f")"
              echo "- **Archivo:** \`${BASE}\`"
              if [ "${{ github.event_name }}" != "pull_request" ]; then
                echo "- **Descarga directa APK:** https://github.com/${{ github.repository }}/releases/download/${TAG}/${BASE}"
              fi
            done
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "- **Página de Release (Latest):** https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            fi
            echo "- **Artefactos del workflow:** disponibles al pie de la pestaña **Summary**."
          } >> "$GITHUB_STEP_SUMMARY"
